services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: hookrelay-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: hookrelay
      RABBITMQ_DEFAULT_PASS: hookrelay_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: hookrelay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  rabbitmq_data:
  redis_data:
